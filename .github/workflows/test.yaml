name: test

# Actions for any push (PR) onto (into) to master

# -----------------
# Control variables (GitHub Secrets)
# -----------------
#
# At the GitHub 'organisation' or 'project' level you must have the following
# GitHub 'Repository Secrets' defined (i.e. via 'Settings -> Secrets'): -
#
# AUTH0_CLIENT_ID
# AUTH0_CLIENT_SECRET
# DMIT_USER_A_PASSWORD
# DMIT_USER_A_PASSWORD
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# Environment         (n/a)

on:
  push:


jobs:
  # check the APIs are responding normally before running tests
  check-api:
    runs-on: ubuntu-latest
    steps:
    - name: Get DM Version
      run: |
        curl -f -X 'GET' \
          'https://data-manager-test.xchem-dev.diamond.ac.uk/data-manager-api/version' \
          -H 'accept: application/json'
    - name: Get AS Version
      run: |
        curl -f -X 'GET' \
          'https://account-server-test.xchem-dev.diamond.ac.uk/account-server-api/version' \
          -H 'accept: application/json'
    # Every login test depends on Keycloak, so an unreachable one otherwise shows up as a handful
    # of opaque `waitForURL` timeouts several minutes into the run rather than a fast, clear signal.
    - name: Get Keycloak OIDC configuration
      run: |
        curl -f -X 'GET' \
          'https://keycloak-test.xchem-dev.diamond.ac.uk/auth/realms/squonk/.well-known/openid-configuration' \
          -H 'accept: application/json'
  test:
    needs: check-api # tests are skipped if APIs are down to avoid false negatives
    # Setup
    runs-on: ubuntu-latest
    environment: data-manager-ui/test
    # The build and the test run have to share one environment rather than declare their own. Next
    # inlines every `NEXT_PUBLIC_*` value at build time, so when only the test step named the API
    # servers the bundle was built with empty ones and the browser asked the app's own origin for
    # `/default/organisation` and `/version` instead of the Account Server and Data Manager.
    env:
      KEYCLOAK_CLIENT_ID: "${{ secrets.AUTH0_CLIENT_ID }}"
      KEYCLOAK_CLIENT_SECRET: "${{ secrets.AUTH0_CLIENT_SECRET }}"
      DMIT_USER_A_PASSWORD: "${{ secrets.DMIT_USER_A_PASSWORD }}"
      BETTER_AUTH_SECRET: "LONG_RANDOM_VALUE"
      BASE_URL: "http://localhost:3000"
      BASE_PATH: "/data-manager-ui"
      DONT_USE_STANDALONE_OUTPUT: true
      DANGEROUS__DISABLE_SSL_CERT_CHECK_IN_API_PROXY: 1
      DATA_MANAGER_API_SERVER: "https://data-manager-test.xchem-dev.diamond.ac.uk/data-manager-api"
      ACCOUNT_SERVER_API_SERVER: "https://account-server-test.xchem-dev.diamond.ac.uk\
        /account-server-api"
      KEYCLOAK_URL: "https://keycloak-test.xchem-dev.diamond.ac.uk/auth/realms/squonk"
      PW_USERNAME: "dmit-user-a"
      PW_PASSWORD: "${{ secrets.DMIT_USER_A_PASSWORD }}"
      TEST_PORT: 3000
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24.15.0
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm ci
    - run: node -v
    - name: Setup Playwright
      run: pnpm exec playwright install --with-deps
    - name: Load cached build for speed
      uses: actions/cache@v5
      with:
        path: |
          ${{ github.workspace }}/.next/cache
        # Generate a new cache whenever packages or source files change.
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{
          hashFiles('**.[jt]s', '**.[jt]sx') }}
        # If source files changed but packages didn't, rebuild from a prior cache.
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
    # Test WITH base path set
    - name: Build with base path
      run: pnpm build
    # Ok for tests/dev but we don't do this on prod. This is to prevent some flakely tests from causing problems
    - name: Disable strict SSL
      run: npm config set strict-ssl=false
    - name: Test with base path
      run: pnpm test:ci
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: Test Results
        path: test-results
